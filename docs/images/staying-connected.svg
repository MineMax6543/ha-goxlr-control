<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Staying connected: while connected, live updates arrive and a full resync runs every 5 minutes. If the connection drops or stays silent for 60 seconds, it counts as lost. GoXLR Control Plus then retries every 1 to 30 seconds and, once back, syncs the full state so nothing is missed. Turning Auto reconnect off pauses the retries.">
  <style>
    :root { --bg: #ffffff; --card: #f4f5f7; --line: #d0d5dd; --text: #1d2939; --muted: #667085; --arrow: #98a2b3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --arrow: #6e7681; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .n { fill: #ffffff; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t { fill: var(--text); font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: var(--muted); font: 400 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h { fill: var(--text); font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a { stroke: var(--arrow); stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .al { fill: var(--muted); font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="250" rx="16"/>
  <text class="h" x="24" y="38">Staying connected, without you doing anything:</text>

  <rect class="card" x="24" y="62" width="208" height="120" rx="14"/>
  <circle cx="54" cy="92" r="16" fill="#22c3dd"/><text class="n" x="49" y="98">1</text>
  <text class="t" x="80" y="98">Connected</text>
  <text class="s" x="40" y="130">live updates, plus a</text>
  <text class="s" x="40" y="150">full resync every 5 min</text>

  <path class="a" d="M234 122 H254"/>
  <rect class="card" x="260" y="62" width="208" height="120" rx="14"/>
  <circle cx="290" cy="92" r="16" fill="#5b8def"/><text class="n" x="285" y="98">2</text>
  <text class="t" x="316" y="98">Lost</text>
  <text class="s" x="276" y="130">dropped, or silent</text>
  <text class="s" x="276" y="150">for 60 seconds</text>

  <path class="a" d="M470 122 H490"/>
  <rect class="card" x="496" y="62" width="208" height="120" rx="14"/>
  <circle cx="526" cy="92" r="16" fill="#8b5cf6"/><text class="n" x="521" y="98">3</text>
  <text class="t" x="552" y="98">Retrying</text>
  <text class="s" x="512" y="130">every 1–30 s; controls</text>
  <text class="s" x="512" y="150">show as unavailable</text>

  <path class="a" d="M706 122 H726"/>
  <rect class="card" x="732" y="62" width="204" height="120" rx="14"/>
  <circle cx="762" cy="92" r="16" fill="#e5458f"/><text class="n" x="757" y="98">4</text>
  <text class="t" x="788" y="98">Back</text>
  <text class="s" x="748" y="130">full state sync,</text>
  <text class="s" x="748" y="150">nothing is missed</text>

  <path class="a" d="M834 184 C834 222 128 222 128 190"/>
  <text class="al" x="400" y="238">and back to 1</text>
  <text class="s" x="560" y="238">Auto reconnect off → step 3 pauses</text>
</svg>
